services:
  database:
    image: postgres:17-alpine
    container_name: toy_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-toy_qachon}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      # Faqat o'z kompyuteringizdan (DBeaver/PyCharm) ulanish uchun: localhost:5433
      - "127.0.0.1:5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    image: toy_qachon:latest
    container_name: toy_web
    restart: always
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      POSTGRES_DB: ${POSTGRES_DB:-toy_qachon}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
    volumes:
      - static_data:/app/static
      - ./media:/app/media
    depends_on:
      database:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: toy_nginx
    restart: always
    ports:
      # Sayt: http://localhost:8000
      - "8000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/static:ro
      - ./media:/app/media:ro
    depends_on:
      - web

volumes:
  pg_data:
  static_data:
