{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vazifalar — To'y Rejalashtiruvchi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Great+Vibes&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{% static 'apps/style.css' %}">
  <link rel="stylesheet" href="{% static 'apps/auth.css' %}">
  <link rel="stylesheet" href="{% static 'apps/theme.css' %}">
</head>
<body data-protected="true">
<div class="layout">

  <aside class="sidebar" id="sidebar">
    <div class="brand">To’y <span>qachon</span></div>

    <a class="nav-link" data-nav href="{% url 'index' %}"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg><span>Bosh sahifa</span></a>

    <div class="nav-title">Boshqaruv</div>
    <a class="nav-link" data-nav href="{% url 'guests' %}"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Mehmonlar</span></a>
    <a class="nav-link" data-nav href="{% url 'budget' %}"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg><span>Byudjet</span></a>
    <a class="nav-link" data-nav href="{% url 'tasks' %}"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg><span>Vazifalar</span></a>

    <div class="nav-title">Katalog</div>
    <a class="nav-link" data-nav href="{% url 'vendors' %}"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 22h18"/><path d="M6 18v-7"/><path d="M10 18v-7"/><path d="M14 18v-7"/><path d="M18 18v-7"/><path d="M12 2 20 7H4z"/></svg><span>Vendorlar</span></a>

    <div class="nav-title">Hisob</div>
    <a class="nav-link" data-nav href="{% url 'profile' %}"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Profil</span></a>
    <a class="nav-link" data-nav href="{% url 'plans' %}"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.3l-5.8 3.1 1.1-6.5-4.7-4.6 6.5-.9z"/></svg><span>Tariflar</span></a>
    <a class="nav-link" data-nav href="{% url 'settings' %}"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg><span>Sozlamalar</span></a>

    <div class="sidebar-footer">
      <button class="btn btn-gold btn-block" id="quickAddBtn">+ Tez qo'shish</button>
    </div>
  </aside>

  <div class="backdrop" id="backdrop"></div>

  <main class="main">
    <header class="topbar">
      <button class="btn btn-ghost menu-btn" id="menuBtn" aria-label="Menyu"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="topbar-right">
        <span class="bell" aria-label="Bildirishnomalar"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></span>
        <span class="user-chip" id="userChip"></span>
        <button class="btn btn-ghost" id="logoutBtn">Chiqish</button>
      </div>
    </header>

    <div class="page-head">
      <div>
        <p class="eyebrow">Timeline</p>
        <h1>Vazifalar</h1>
      </div>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button class="btn btn-gold" id="addTaskBtn">+ Vazifa qo'shish</button>
      </div>
    </div>

    <section class="grid g-4">
      <div class="card stat"><div class="stat-icon"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg></div><div class="stat-value" id="statTotal">0</div><div class="stat-label">Jami vazifalar</div></div>
      <div class="card stat"><div class="stat-icon"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg></div><div class="stat-value" id="statDone">0</div><div class="stat-label">Bajarilgan</div></div>
      <div class="card stat"><div class="stat-icon"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 22h14"/><path d="M5 2h14"/><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"/><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"/></svg></div><div class="stat-value" id="statPending">0</div><div class="stat-label">Kutilayotgan</div></div>
      <div class="card stat"><div class="stat-icon"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg></div><div class="stat-value" id="statOverdue">0</div><div class="stat-label">Muddati o'tgan</div></div>
    </section>

    <section class="card mt">
      <div class="toolbar">
        <div class="tabs" id="filterTabs">
          <button class="tab active" data-filter="all">Hammasi</button>
          <button class="tab" data-filter="pending">Kutilayotgan</button>
          <button class="tab" data-filter="done">Bajarilgan</button>
          <button class="tab" data-filter="overdue">Muddati o'tgan</button>
        </div>
        <div class="toolbar-left">
          <input class="input" id="taskSearch" placeholder="Qidirish...">
        </div>
      </div>

      <div id="taskList"></div>
      <div class="empty" id="taskEmpty" style="display:none">Vazifa topilmadi</div>
    </section>
  </main>
</div>

<!-- Qo'shish / tahrirlash modali -->
<div class="modal" id="taskModal">
  <form class="modal-box" id="taskForm">
    <h3 id="taskModalTitle">Yangi vazifa</h3>
    <div class="form-grid">
      <label class="full">Vazifa nomi
        <input class="input" name="title" required>
      </label>
      <label>Muddat
        <input class="input" name="due_date" type="date">
      </label>
      <label>Ustuvorlik
        <select class="select" name="priority">
          <option value="high">Yuqori</option>
          <option value="medium" selected>O'rta</option>
          <option value="low">Past</option>
        </select>
      </label>
      <label class="full">Izoh
        <input class="input" name="description">
      </label>
    </div>
    <p class="auth-error" id="taskError"></p>
    <div class="modal-actions">
      <button type="button" class="btn" id="cancelTaskBtn">Bekor qilish</button>
      <button type="submit" class="btn btn-gold">Saqlash</button>
    </div>
  </form>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script src="{% static 'apps/style.js' %}"></script>
<script src="{% static 'apps/auth.js' %}"></script>
<script src="{% static 'apps/tasks.js' %}"></script>
</body>
</html>
