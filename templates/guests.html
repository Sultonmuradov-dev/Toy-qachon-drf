{% load static %}


<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mehmonlar — To'y Rejalashtiruvchi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Great+Vibes&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{% static 'apps/style.css' %}">
  <link rel="stylesheet" href="{% static 'apps/auth.css' %}">
  <link rel="stylesheet" href="{% static 'apps/theme.css' %}">
</head>
<body data-protected="true">
<div class="layout">

  <aside class="sidebar" id="sidebar">
    <div class="brand">Nikoh<span>Plan</span></div>

    <a class="nav-link" data-nav href="{% url 'index' %}"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg><span>Bosh sahifa</span></a>

    <div class="nav-title">Boshqaruv</div>
    <a class="nav-link" data-nav href="{% url 'guests' %}"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Mehmonlar</span></a>
    <a class="nav-link" data-nav href="{% url 'budget' %}"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg><span>Byudjet</span></a>
    <a class="nav-link" data-nav href="{% url 'tasks' %}"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg><span>Vazifalar</span></a>

    <div class="nav-title">Katalog</div>
    <a class="nav-link" data-nav href="{% url 'vendors' %}"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 22h18"/><path d="M6 18v-7"/><path d="M10 18v-7"/><path d="M14 18v-7"/><path d="M18 18v-7"/><path d="M12 2 20 7H4z"/></svg><span>Vendorlar</span></a>

    <div class="sidebar-footer">
      <button class="btn btn-gold btn-block" id="quickAddBtn">+ Tez qo'shish</button>
    </div>
  </aside>

  <div class="backdrop" id="backdrop"></div>

  <main class="main">
    <header class="topbar">
      <button class="btn btn-ghost menu-btn" id="menuBtn" aria-label="Menyu"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="topbar-right">
        <span class="bell" aria-label="Bildirishnomalar"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></span>
        <span class="user-chip">Yodgor</span>
        <button class="btn btn-ghost" id="logoutBtn">Chiqish</button>
      </div>
    </header>

    <div class="page-head">
      <div>
        <p class="eyebrow">Mehmonlar ro'yxati</p>
        <h1>Mehmonlar</h1>
      </div>
      <button class="btn btn-gold" id="addGuestBtn">+ Mehmon qo'shish</button>
    </div>

    <section class="grid g-4">
      <div class="card stat"><div class="stat-icon"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div><div class="stat-value" id="sTotal">0</div><div class="stat-label">Jami mehmonlar</div></div>
      <div class="card stat"><div class="stat-icon"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg></div><div class="stat-value" id="sConfirmed">0</div><div class="stat-label">Tasdiqlagan</div></div>
      <div class="card stat"><div class="stat-icon"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg></div><div class="stat-value" id="sInvited">0</div><div class="stat-label">Taklif qilingan</div></div>
      <div class="card stat"><div class="stat-icon"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></svg></div><div class="stat-value" id="sDeclined">0</div><div class="stat-label">Kelmaydi</div></div>
    </section>

    <section class="card mt">
      <div class="toolbar">
        <div class="tabs" id="statusTabs">
          <button class="tab active" data-status="all">Hammasi</button>
          <button class="tab" data-status="invited">Taklif qilingan</button>
          <button class="tab" data-status="confirmed">Tasdiqlagan</button>
          <button class="tab" data-status="declined">Kelmaydi</button>
        </div>
        <div class="toolbar-left">
          <input class="input" id="search" placeholder="Qidirish...">
          <select class="select" id="sideFilter">
            <option value="">Barcha taraf</option>
            <option value="bridge">Kelin tomoni</option>
            <option value="groom">Kuyov tomoni</option>
          </select>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Ism</th><th>Telefon</th><th>Taraf</th><th>Guruh</th><th>Status</th><th></th>
            </tr>
          </thead>
          <tbody id="guestRows"></tbody>
        </table>
        <div class="empty" id="emptyState" style="display:none">Mehmon topilmadi</div>
      </div>
    </section>
  </main>
</div>

<!-- Qo'shish / tahrirlash modali -->
<div class="modal" id="guestModal">
  <form class="modal-box" id="guestForm">
    <h3 id="modalTitle">Yangi mehmon</h3>
    <div class="form-grid">
      <label class="full">Ism familiya
        <input class="input" name="full_name" required>
      </label>
      <label>Telefon
        <input class="input" name="phone_number" placeholder="+998 (__) ___-__-__" maxlength="19">
      </label>
      <label>Taraf
        <select class="select" name="side">
          <option value="bridge">Kelin tomoni</option>
          <option value="groom">Kuyov tomoni</option>
        </select>
      </label>
      <label>Guruh
        <select class="select" name="group">
          <option value="family">Oila</option>
          <option value="friends">Do'stlar</option>
          <option value="colleagues">Hamkasblar</option>
        </select>
      </label>
      <label class="full">Status
        <select class="select" name="status">
          <option value="invited">Taklif qilindi</option>
          <option value="confirmed">Tasdiqlandi</option>
          <option value="declined">Kelmaydi</option>
        </select>
      </label>
    </div>
    <p class="auth-error" id="guestError"></p>
    <div class="modal-actions">
      <button type="button" class="btn" id="cancelBtn">Bekor qilish</button>
      <button type="submit" class="btn btn-gold">Saqlash</button>
    </div>
  </form>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script src="{% static 'apps/style.js' %}"></script>
<script src="{% static 'apps/auth.js' %}"></script>
<script src="{% static 'apps/guests.js' %}"></script>
</body>
</html>
