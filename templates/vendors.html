{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendorlar — To'y Rejalashtiruvchi</title>
  <link rel="stylesheet" href="{% static 'apps/style.css' %}">
  <link rel="stylesheet" href="{% static 'apps/auth.css' %}">
</head>
<body data-protected="true">
<div class="layout">

  <aside class="sidebar" id="sidebar">
    <div class="brand">To'y<span>Qachon</span></div>

    <a class="nav-link" data-nav href="{% url 'index' %}">🏠 Bosh sahifa</a>

    <div class="nav-title">Boshqaruv</div>
    <a class="nav-link" data-nav href="{% url 'guests' %}">👥 Mehmonlar</a>
    <a class="nav-link" data-nav href="{% url 'budget' %}">💰 Byudjet</a>
    <a class="nav-link" data-nav href="{% url 'tasks' %}">✅ Vazifalar</a>

    <div class="nav-title">Katalog</div>
    <a class="nav-link" data-nav href="{% url 'vendors' %}">🏛 Vendorlar</a>

    <div class="nav-title">Hisob</div>
    <a class="nav-link" data-nav href="{% url 'plans' %}">⭐ Tariflar</a>
    <a class="nav-link" data-nav href="{% url 'settings' %}">⚙️ Sozlamalar</a>
  </aside>

  <div class="backdrop" id="backdrop"></div>

  <main class="main">
    <header class="topbar">
      <button class="btn btn-ghost menu-btn" id="menuBtn" aria-label="Menyu">☰</button>
      <div class="topbar-right">
        <span class="bell">🔔</span>
        <span class="user-chip" id="userChip"></span>
        <button class="btn btn-ghost" id="logoutBtn">Chiqish</button>
      </div>
    </header>

    <div class="page-head">
      <div>
        <p class="eyebrow">Katalog</p>
        <h1>Vendorlar</h1>
      </div>
    </div>

    <section class="card">
      <div class="toolbar">
        <div class="tabs" id="categoryTabs">
          <button class="tab active" data-category="all">Hammasi</button>
          <button class="tab" data-category="venue">To'yxona</button>
          <button class="tab" data-category="photo">Fotograf</button>
          <button class="tab" data-category="decor">Dekorator</button>
          <button class="tab" data-category="bridal">Kelinlik salon</button>
          <button class="tab" data-category="music">Musiqachilar</button>
          <button class="tab" data-category="catering">Oshxona</button>
        </div>
        <div class="toolbar-left">
          <input class="input" id="vendorSearch" placeholder="Nomi yoki shahar...">
          <select class="select" id="priceFilter">
            <option value="">Barcha narx</option>
            <option value="0-5000000">5 mln gacha</option>
            <option value="5000000-15000000">5–15 mln</option>
            <option value="15000000-">15 mln dan yuqori</option>
          </select>
        </div>
      </div>
    </section>

    <div class="vendor-grid mt" id="vendorGrid"></div>
    <div class="empty" id="vendorEmpty" style="display:none">Vendor topilmadi</div>
  </main>
</div>

<!-- Sharhlar modali -->
<div class="modal" id="reviewModal">
  <div class="modal-box">
    <h3 id="reviewTitle">Sharhlar</h3>
    <div id="reviewList" style="max-height:260px; overflow:auto; margin-bottom:12px;"></div>

    <p class="muted" id="reviewNote" style="display:none;">Siz bu vendorga allaqachon sharh yozgansiz.</p>

    <form id="reviewForm" style="display:none;">
      <div class="form-grid">
        <label>Baho
          <select class="select" name="stars">
            <option value="5">5 ★</option>
            <option value="4">4 ★</option>
            <option value="3">3 ★</option>
            <option value="2">2 ★</option>
            <option value="1">1 ★</option>
          </select>
        </label>
        <label class="full">Izoh
          <textarea class="input" name="comment" rows="3" maxlength="500"></textarea>
        </label>
      </div>
      <p class="auth-error" id="reviewError"></p>
      <div class="modal-actions">
        <button type="button" class="btn" id="closeReviewBtn">Yopish</button>
        <button type="submit" class="btn btn-gold">Yuborish</button>
      </div>
    </form>

    <div class="modal-actions" id="reviewCloseOnly" style="display:none;">
      <button type="button" class="btn" id="closeReviewBtn2">Yopish</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script src="{% static 'apps/style.js' %}"></script>
<script src="{% static 'apps/auth.js' %}"></script>
<script src="{% static 'apps/vendors.js' %}"></script>
</body>
</html>
