{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %} — To'y Reja</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body data-private data-home="{% url 'home' %}">
<div class="app">
  <aside class="side">
    <a class="brand" href="{% url 'home' %}"><span class="heart">♥</span> To'y Reja</a>
    <nav aria-label="Bo'limlar">
     <a href="{% url 'dashboard' %}" {% if request.resolver_match.url_name == 'dashboard' %}aria-current="page"{% endif %}>Asosiy sahifa</a>
    </nav>
  </aside>
  <div class="main">
    <header class="topbar"><span class="who" id="userName"></span><button class="btn ghost sm" id="logout">Chiqish</button></header>
    <main class="content">{% block content %}{% endblock %}</main>
  </div>
</div>
<script src="{% static 'js/app.js' %}"></script>
</body>
</html>
